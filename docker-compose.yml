version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: goodpm-postgres
    environment:
      POSTGRES_USER: goodpm
      POSTGRES_PASSWORD: goodpm
      POSTGRES_DB: goodpm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - goodpm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodpm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goodpm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - goodpm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  goodpm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
